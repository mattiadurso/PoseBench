name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.13.1
      # Uses the [tool.ruff] config in pyproject.toml (vendored trees are excluded there).
      - run: ruff check .

  test:
    name: Pytest (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU dependencies
        # torch from the CPU index keeps the install light (no CUDA wheels); the
        # rest is pinned in requirements-ci.txt (the tests/ import closure).
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
      - name: Run tests
        # GPU-only tests (e.g. the disk-kornia smoke test) skip automatically when
        # CUDA is unavailable, so the suite is green on CPU runners.
        run: pytest tests/ -p no:cacheprovider
